<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Welcome Email — Renaissance Rentals Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--black:#0a0a0a;--white:#f5f5f0;--gold:#c9a84c;--gold-dim:#a07e2e;
--card-bg:#111;--border:#222;--text-secondary:#999;
--serif:'Cormorant Garamond',Georgia,serif;
--sans:'Montserrat',sans-serif;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
.page-wrapper{max-width:560px;margin:0 auto;padding:48px 24px 60px}
.header{text-align:center;margin-bottom:40px}
.logo{display:block;width:80px;height:auto;margin:0 auto 18px}
.header h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.header .tagline{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:500}
.back-link{display:inline-block;margin-bottom:20px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-secondary);text-decoration:none}
.back-link:hover{color:var(--gold)}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:2px;padding:28px 26px;margin-bottom:22px}
.card h2{font-family:var(--serif);font-size:1.25rem;letter-spacing:.06em;margin-bottom:18px;color:var(--white);font-weight:400}
.form-row{display:flex;gap:14px;margin-bottom:16px}
.field{flex:1;display:flex;flex-direction:column}
.field label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:500}
.field input{
background:#0a0a0a;border:1px solid var(--border);border-radius:2px;
color:var(--white);font-family:var(--sans);font-size:.95rem;
padding:12px 14px;width:100%;
transition:border-color .2s;
}
.field input:focus{outline:none;border-color:var(--gold-dim)}
.field input::placeholder{color:#555}
button.gmail-btn{
display:flex;align-items:center;justify-content:center;gap:10px;
width:100%;font-family:var(--sans);font-size:.75rem;letter-spacing:.2em;
text-transform:uppercase;background:var(--gold);color:var(--black);
border:none;border-radius:2px;padding:16px 24px;cursor:pointer;
font-weight:500;transition:background .2s;margin-top:6px;
}
button.gmail-btn:hover{background:var(--gold-dim);color:var(--white)}
button.gmail-btn:disabled{opacity:.4;cursor:not-allowed}
button.gmail-btn svg{width:18px;height:18px;flex-shrink:0}
.preview-card{background:var(--card-bg);border:1px solid var(--border);border-radius:2px;padding:28px 26px;margin-bottom:22px;display:none}
.preview-card.show{display:block}
.preview-card h2{font-family:var(--serif);font-size:1.25rem;letter-spacing:.06em;margin-bottom:6px;color:var(--white);font-weight:400}
.preview-card .subject{font-size:.78rem;color:var(--text-secondary);margin-bottom:18px;letter-spacing:.05em}
.email-body{background:#0a0a0a;border:1px solid var(--border);border-radius:2px;padding:20px 22px;font-size:.9rem;line-height:1.85;white-space:pre-wrap;color:var(--white)}
.email-body .hi{font-weight:500;color:var(--gold)}
.wa-card{background:var(--card-bg);border:1px solid var(--border);border-radius:2px;padding:28px 26px;margin-bottom:22px;display:none}
.wa-card.show{display:block}
.wa-card h2{font-family:var(--serif);font-size:1.25rem;letter-spacing:.06em;margin-bottom:4px;color:var(--white);font-weight:400}
.wa-group-name{font-size:.78rem;color:var(--text-secondary);margin-bottom:18px}
.wa-group-name span{color:var(--gold);font-weight:500;font-family:monospace;font-size:.88rem;letter-spacing:.05em}
.copy-block{position:relative;margin-bottom:14px}
.copy-block textarea{width:100%;background:#0a0a0a;border:1px solid var(--border);border-radius:2px;padding:16px 18px 16px 18px;font-size:.9rem;line-height:1.85;color:var(--white);font-family:var(--sans);font-weight:300;resize:none;outline:none;white-space:pre-wrap}
.copy-block textarea:focus{border-color:var(--gold-dim)}
.copy-btn{font-family:var(--sans);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;background:transparent;color:var(--gold);border:1px solid var(--gold-dim);border-radius:2px;padding:6px 14px;cursor:pointer;transition:background .2s,color .2s;margin-top:8px}
.copy-btn:hover{background:var(--gold-dim);color:var(--white)}
.group-name-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;background:#0a0a0a;border:1px solid var(--border);border-radius:2px;padding:12px 16px}
.group-name-val{font-family:monospace;font-size:1rem;color:var(--gold);flex:1;letter-spacing:.04em}
.footer{text-align:center;margin-top:40px;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:#555}
@media(max-width:480px){.form-row{flex-direction:column}}
</style>
</head>
<body>

<div class="page-wrapper">

<a class="back-link" href="staff.html">&larr; Back to Staff Tools</a>

<div class="header">
<img src="assets/rr-logo.png" alt="Renaissance Rentals" class="logo">
<h1>Welcome Email</h1>
<div class="tagline">New Customer Onboarding</div>
</div>

<div class="card">
<h2>Customer Details</h2>
<div class="form-row">
<div class="field">
<label for="custName">Customer Name</label>
<input type="text" id="custName" placeholder="e.g. James Miller" oninput="update()">
</div>
</div>
<div class="form-row">
<div class="field">
<label for="carTitle">Rental Car</label>
<input type="text" id="carTitle" placeholder="e.g. Toyota HiLux" oninput="update()">
</div>
<div class="field">
<label for="carRego">Rego</label>
<input type="text" id="carRego" placeholder="e.g. 289ZBA" oninput="update()" style="text-transform:uppercase">
</div>
</div>

<button class="gmail-btn" id="gmailBtn" onclick="openGmail()">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
<path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
</svg>
Open in Gmail
</button>
</div>

<div class="preview-card" id="previewCard">
<h2>Preview</h2>
<div class="subject" id="previewSubject"></div>
<div class="email-body" id="previewBody"></div>
</div>

<div class="wa-card" id="waCard">
<h2>WhatsApp Welcome Message</h2>
<div class="group-name-row">
<div class="group-name-val" id="waGroupName">—</div>
<button class="copy-btn" onclick="copyText('waGroupName', this)">Copy Group Name</button>
</div>
<div class="copy-block">
<textarea id="waBody" rows="20" readonly></textarea>
<button class="copy-btn" onclick="copyTextarea('waBody', this)">Copy Message</button>
</div>
</div>

<div class="footer">Internal Use Only &middot; Renaissance Rentals QLD</div>

</div>

<script>
const $ = id => document.getElementById(id);

function buildEmail() {
  const name = $('custName').value.trim();
  const car  = $('carTitle').value.trim();
  const rego = $('carRego').value.trim().toUpperCase();
  const firstName = name.split(' ')[0] || 'there';

  const subject = `Welcome to Renaissance Rentals${car && rego ? ' — ' + car + ' (' + rego + ')' : ''}`;

  const body =
`Hi ${firstName},

Welcome to Renaissance Rentals! We’re delighted to have you on board${car && rego ? ‘ with your ‘ + car + ‘ (‘ + rego + ‘)’ : ‘’}.

A WhatsApp group chat will be set up for you shortly, including yourself and our team. This will be your dedicated channel for anything related to your rental — please don’t hesitate to reach out at any time.

—— In the Event of a Road Incident ——

1. Keep everyone safe — move all vehicles to a safe location where possible.
2. Call 000 if there are any injuries or the vehicle is blocking traffic.
3. Exchange details with all other parties — photo of driver’s licence, contact number, vehicle registration, and insurance details.
4. Photograph the scene, all vehicles involved, and any visible damage.
5. Contact us immediately via WhatsApp — even if you’re unsure of the severity.
6. Contact Roadside Assistance if needed — 1300 419 403

⚠ Failure to obtain the above details from all other parties may result in you being held fully liable for all damages.

—— Omni Rideshare Insurance — Emergency Contacts ——

24/7 Roadside Assistance: 1300 419 403
(Call first for flat tyres, breakdowns, lockouts, or towing — 24 hours, 7 days)

Claim Team:         0480 859 669
Customer Service:   0466 042 683
Omni Head Office:   1300 365 159

—— Tolls, Fines & Incidentals ——

Any tolls incurred during your rental will be invoiced on a fortnightly basis.

Please also be aware that any fines incurred during the rental period will be automatically transferred to the registered driver’s licence.

If you have any questions at all, we’re here to help.

Kind regards,
Renaissance Rentals QLD`;

  return { subject, body };
}

function buildWhatsApp() {
  const name = $('custName').value.trim();
  const car  = $('carTitle').value.trim();
  const rego = $('carRego').value.trim().toUpperCase();
  const firstName = name.split(' ')[0] || 'there';

  const groupName = `${firstName} ${rego} Rental`;

  const msg =
`👋 Welcome to Renaissance Rentals, ${firstName}!

This is your dedicated group chat for everything related to your rental${car && rego ? ' of the ' + car + ' (' + rego + ')' : ''}. Our team is here and you can reach us anytime right here.

🚗 *In the Event of a Road Incident*

1. Keep everyone safe — move all vehicles to a safe location where possible.
2. Call *000* if there are any injuries or the vehicle is blocking traffic.
3. Exchange details with all other parties — photo of driver's licence, contact number, vehicle registration, and insurance details.
4. Photograph the scene, all vehicles involved, and any visible damage.
5. Contact us immediately right here in this chat — even if you're unsure of the severity.
6. Contact Roadside Assistance if needed — *1300 419 403*

⚠️ *Failure to obtain the above details from all other parties may result in you being held fully liable for all damages.*

🆘 *Omni Rideshare Insurance — Emergency Contacts*

📞 *24/7 Roadside Assistance: 1300 419 403*
_(Flat tyres, breakdowns, lockouts, towing — 24 hrs, 7 days)_

Claim Team: 0480 859 669
Customer Service: 0466 042 683
Omni Head Office: 1300 365 159

💳 *Tolls, Fines & Incidentals*

Any tolls incurred during your rental will be billed to you on a fortnightly basis via invoice.

Please note that any fines incurred during the rental period will be automatically transferred to the registered driver's licence.

If you have any questions at all — don't hesitate to ask. We're happy to help! 😊`;

  return { groupName, msg };
}

function update() {
  const name = $('custName').value.trim();
  const car  = $('carTitle').value.trim();
  const rego = $('carRego').value.trim();
  const ready = name && car && rego;

  if (ready) {
    const { subject, body } = buildEmail();
    $('previewSubject').textContent = 'Subject: ' + subject;
    $('previewBody').textContent = body;
    $('previewCard').classList.add('show');

    const { groupName, msg } = buildWhatsApp();
    $('waGroupName').textContent = groupName;
    $('waBody').value = msg;
    // Auto-size textarea
    $('waBody').style.height = 'auto';
    $('waBody').style.height = $('waBody').scrollHeight + 'px';
    $('waCard').classList.add('show');
  } else {
    $('previewCard').classList.remove('show');
    $('waCard').classList.remove('show');
  }
}

function copyText(elId, btn) {
  const text = $(elId).textContent;
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function copyTextarea(elId, btn) {
  const ta = $(elId);
  ta.select();
  navigator.clipboard.writeText(ta.value).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => btn.textContent = orig, 1500);
  }).catch(() => document.execCommand('copy'));
}

function openGmail() {
  const name = $('custName').value.trim();
  const car  = $('carTitle').value.trim();
  const rego = $('carRego').value.trim();
  if (!name || !car || !rego) {
    alert('Please fill in Customer Name, Rental Car, and Rego first.');
    return;
  }
  const { subject, body } = buildEmail();
  const url = 'https://mail.google.com/mail/?view=cm&su=' +
    encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  window.open(url, '_blank', 'noopener');
}
</script>
</body>
</html>
